[package]
name = "tessera"
version = "0.21.0"
description = "Tessera personal local-first database"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"
tessera-sqlite = { path = "sqlite-bridge" }

tauri-plugin-dialog = "=2.8.4"

url = "=2.5.8"

sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "3"
