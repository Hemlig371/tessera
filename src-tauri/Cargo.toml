[package]
name = "tessera"
version = "0.2.0"
description = "Tessera personal local-first database"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"
tessera-sqlite = { path = "sqlite-bridge" }

tauri-plugin-dialog = "2"
