[package]
name = "tessera-sqlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
autotests = false

[dependencies]
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "sqlite-test-driver"
path = "tests/driver.rs"
required-features = ["test-driver"]

[features]
test-driver = []
